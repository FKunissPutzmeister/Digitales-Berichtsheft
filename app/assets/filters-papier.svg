<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!-- Papierheft-Retro: Wackel-Filter für den "handgezeichneten" Look.
       Verwendung: filter: url("../assets/filters-papier.svg#roughen") in
       theme-papier.css. Zwei Varianten (unterschiedliche Frequenz/Stärke),
       damit Elemente unterschiedlicher Größe (Logo vs. kleine Sidebar-
       Icons) nicht identisch verzerrt aussehen. Werte aus dem gebilligten
       Brainstorm-Mockup übernommen (dezenter Wackel-Grad). -->
  <filter id="roughen" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.028" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- roughen-fine wurde nach Live-Feedback ("Icons wirken nicht
       handgezeichnet") von einer einzelnen, kaum sichtbaren Verzerrung
       (scale 1.6) auf einen Doppelstrich-Skizzen-Effekt umgestellt:
       zwei UNABHÄNGIG verzerrte Kopien (unterschiedlicher seed) werden
       übereinandergelegt (feMerge) – klassischer "Rough.js"/xkcd-Look,
       weil zwei leicht versetzte Konturen viel eindeutiger als "von
       Hand nachgezogen" gelesen werden als eine einzelne verwackelte. -->
  <filter id="roughen-fine" x="-50%" y="-50%" width="200%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09 0.15" numOctaves="2" seed="11" result="noise1"/>
    <feDisplacementMap in="SourceGraphic" in2="noise1" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="sketch1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.11 0.17" numOctaves="2" seed="29" result="noise2"/>
    <feDisplacementMap in="SourceGraphic" in2="noise2" scale="3.4" xChannelSelector="R" yChannelSelector="G" result="sketch2"/>
    <feMerge>
      <feMergeNode in="sketch2"/>
      <feMergeNode in="sketch1"/>
    </feMerge>
  </filter>
</svg>
